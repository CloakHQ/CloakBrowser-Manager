services:
  manager:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ~/.cloakbrowser-manager:/data
    environment:
      # Values come from the manager-root .env (compose reads it automatically).
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      - CLOAKBROWSER_CACHE_DIR=${CLOAKBROWSER_CACHE_DIR:-/data/binaries}
