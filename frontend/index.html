<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CloakBrowser Manager (Custom)</title>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <script>
      // Resolve the theme before the bundle loads so the first paint is right.
      (function () {
        try {
          var pref = localStorage.getItem("cloakmanager.theme");
          var dark =
            pref === "dark" ||
            (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body class="bg-surface-0 text-fg antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
