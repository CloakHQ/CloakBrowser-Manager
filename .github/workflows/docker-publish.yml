name: Test and publish Docker image

# `publish` builds each image "variant" in the matrix below and pushes it to
# GHCR on every push to every branch (test-only on pull_request), then cuts a
# GitHub Release pinned to that commit + variant.
#
# Only one variant exists today: `cpu` (the software-rendering base image,
# ./Dockerfile — no Intel/AMD/NVIDIA GPU). Add docker-compose.igpu.yml's or
# docker-compose.nvidia.yml's Dockerfile later by adding one entry to the
# matrix; nothing else needs to change. image_suffix is "" for this one
# deliberately, so the already-published ghcr.io/.../cloakbrowser-manager
# image and its :latest/:sha-* tags don't get renamed out from under existing
# pulls — a later variant sets its own suffix (e.g. "-igpu") instead.
#
# `publish` (not `test`) is gated to this fork specifically, so a downstream
# fork's own Actions runs don't push images/releases under an assumption that
# only applies here.

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest pytest-asyncio
      - name: Test backend
        run: python -m pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Test frontend
        working-directory: frontend
        run: npm test -- --run
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.repository == 'cjangrist/CloakBrowser-Manager'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu
            dockerfile: Dockerfile
            image_suffix: ""
            platforms: linux/amd64,linux/arm64
    concurrency:
      group: docker-publish-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/cloakbrowser-manager${{ matrix.image_suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

      - name: Compute short SHA
        id: shortsha
        run: echo "sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sha-${{ steps.shortsha.outputs.sha }}-${{ matrix.name }}
          name: ${{ matrix.name }} @ ${{ steps.shortsha.outputs.sha }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            **Image:** `ghcr.io/${{ github.repository_owner }}/cloakbrowser-manager${{ matrix.image_suffix }}:sha-${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`

            ```
            docker pull ghcr.io/${{ github.repository_owner }}/cloakbrowser-manager${{ matrix.image_suffix }}:sha-${{ github.sha }}
            ```
