# CloakBrowser Manager — nginx data plane.
# Public entry on :8080 inside the container:
#   /            → FastAPI control plane (SPA + /api)
#   /api/profiles/<id>/cdp → same upstream, but never idle-reaped
#   /viewer/...  → per-profile KasmVNC websocket port, gated by FastAPI auth

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # WebSocket upgrade header mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Preserve the ORIGINAL client scheme. Forwarding $scheme verbatim would
    # erase the "https" an outer TLS terminator (Cloudflare Tunnel, ingress LB)
    # sent, and the control plane would then advertise ws:// CDP URLs to an
    # https page. Fall back to $scheme only when there is no inbound value —
    # which is now meaningful in both directions, since this nginx terminates
    # TLS itself on :8443 and answers plain HTTP on :8080.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Original request path without query string ($uri is post-rewrite,
    # $request_uri carries args — the viewer token travels in both).
    map $request_uri $request_path {
        ~^(?<noargs_path>[^?]*) $noargs_path;
        default $uri;
    }

    # The /viewer/<token> prefix of the CURRENT request, for proxy_redirect.
    # KasmVNC answers a directory path with no trailing slash with its own 301
    # to a path-absolute Location ("/assets/"), which has already had our prefix
    # stripped by the rewrite. Following it verbatim takes the browser out of
    # the authenticated /viewer/<token>/ namespace and into the Manager SPA's
    # own static mount, which serves something entirely unrelated.
    map $request_uri $viewer_prefix {
        ~^(?<vp>/viewer/[^/?]+) $vp;
        default "";
    }

    # Never log the viewer token: /viewer/<token>/... → /viewer/_/...
    map $request_path $redacted_uri {
        ~^/viewer/[^/]+/(?<redacted_rest>.*)$ /viewer/_/$redacted_rest;
        default $request_path;
    }

    # No query strings in the log line — the viewer URL carries the token.
    log_format redacted '$remote_addr - [$time_local] '
                        '"$request_method $redacted_uri $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent"';

    access_log /dev/stdout redacted;

    server {
        listen 8080;
        # HTTPS ALONGSIDE plain HTTP, not instead of it: the health check, the
        # data-plane probe and every loopback API caller stay on :8080, while
        # anything reached by IP can use :8443 and get a secure context.
        #
        # That secure context is the whole point. The KasmVNC client will not
        # select any video codec without WebCodecs, and browsers withhold
        # WebCodecs from plain-http origins that are not localhost — so a viewer
        # on http://<lan-ip>:8080 silently runs on JPEG/WebP with the GPU
        # encoder idle, and the same viewer on https://<lan-ip>:8443 negotiates
        # h264_nvenc. One server block serves both, so the two listeners cannot
        # drift apart.
        listen 8443 ssl;
        http2 on;
        # Written by entrypoint.sh from /data/tls (persistent across restarts),
        # with an image-baked fallback so `nginx -t` passes in a bare container.
        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:2m;
        ssl_session_timeout 1h;
        server_name _;

        # ── Authenticated KasmVNC viewer proxy ───────────────────────────
        location /viewer/ {
            # Block Kasm's management /api from clients; the Manager proxies
            # stats itself. `return` fires before auth_request, nothing leaks.
            location ~ ^/viewer/[^/]+/api(/|$) {
                return 403;
            }

            # /viewer/<token> with no trailing slash does not match the
            # prefix-strip rewrite below, so the unstripped URI would reach
            # KasmVNC and 404 after a successful auth. Normalise it.
            #
            # absolute_redirect off: nginx would otherwise build the Location
            # from its OWN listener — http://host:8080/... — which behind a TLS
            # terminator is both the wrong scheme (blocked as mixed content in
            # an https iframe) and a port that is not published. A relative
            # Location resolves against whatever origin the client actually
            # used.
            location ~ ^/viewer/[^/]+$ {
                absolute_redirect off;
                return 308 $uri/$is_args$args;
            }

            auth_request /_viewer_auth;
            auth_request_set $viewer_upstream $upstream_http_x_viewer_upstream;
            auth_request_set $viewer_authorization $upstream_http_x_viewer_authorization;

            # Strip the /viewer/<token> prefix; Kasm client assets are ./-relative.
            #
            # LOCATION-LOCAL. auth_request IS inherited by the nested locations
            # above, but rewrite and proxy_pass are NOT: a nested block that
            # proxies would forward the unstripped, token-bearing /viewer/<t>/x
            # to KasmVNC and get a 404 after a *successful* auth — the exact
            # failure the 308 block exists to fix, reintroduced silently. The
            # two nested blocks here are safe only because `return` ends the
            # request in the rewrite phase. Any future nested location that
            # proxies must repeat this rewrite; test_dataplane.py enforces it.
            rewrite ^/viewer/[^/]+(/.*)$ $1 break;

            # Variable upstream (IP:port from auth response) — no resolver needed.
            proxy_pass http://$viewer_upstream;
            # Kasm's HTTP layer requires Basic auth; the token auth response
            # carries the per-display credentials. Injected server-side so the
            # browser never sees them.
            proxy_set_header Authorization $viewer_authorization;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            # Kasm's COEP/COOP response headers must pass through untouched.

            # Put our stripped prefix back on anything KasmVNC redirects to, in
            # both the absolute form it builds from Host and the path-absolute
            # form. Without this a redirect leaves the token namespace and the
            # SPA answers instead of the viewer.
            # absolute_redirect off for the same reason the nested 308 block sets
            # it: nginx would otherwise rebuild the rewritten Location from its
            # OWN listener (http://host:8080/...), which behind a TLS terminator
            # is both the wrong scheme and a port that is not published.
            absolute_redirect off;
            proxy_redirect ~^https?://[^/]+(/.*)$ $viewer_prefix$1;
            proxy_redirect / $viewer_prefix/;

            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
            proxy_connect_timeout 1800s;
            proxy_buffering off;
            client_max_body_size 10M;
        }

        # Viewer-token auth subrequest → FastAPI. Expects X-Viewer-Upstream
        # (IP:port) in the 2xx response.
        location = /_viewer_auth {
            internal;
            proxy_pass http://127.0.0.1:8081/api/viewer-auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $http_host;
        }

        # For external probes only. The container HEALTHCHECK deliberately hits
        # /api/status instead so that it exercises nginx AND uvicorn together —
        # this endpoint answers even when the control plane is dead.
        location = /healthz {
            access_log off;
            return 200;
        }

        # ── CDP tunnels: no idle reaping ──────────────────────────────────
        # Playwright/Puppeteer park on an attached CDP WebSocket and can go a
        # long time without application traffic, so `location /`'s 1800s read
        # timeout is the wrong bound for them.
        #
        # MEASURED, and not what an earlier comment here claimed: nginx re-arms
        # the read timer on traffic in EITHER direction on an upgraded
        # connection, and uvicorn sends a client-facing WebSocket ping every 20s
        # (ws_ping_interval, never configured here), so in the shipped stack the
        # timer is reset long before any nginx bound is reached. `1d` is
        # therefore defence-in-depth for the case where that keepalive is off,
        # not the sole guard — verified by a 35-minute idle soak that stayed
        # open and answered Browser.getVersion immediately afterwards.
        #
        # The REAL ceiling on an idle CDP session is uvicorn, not nginx: a
        # client that does not answer those pings is closed at
        # ws_ping_interval + ws_ping_timeout = 40s with code 1011
        # "keepalive ping timeout". Any CDP client must answer pings; every
        # mainstream one does.
        # A regex location wins over the `/` prefix, and it must restate every
        # proxy directive because sibling locations inherit nothing from each
        # other.
        location ~ ^/api/profiles/[^/]+/cdp(/|$) {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # Not 0: nginx passes this straight to ngx_add_timer, so zero fires
            # immediately rather than meaning "never". A day is past any real
            # automation run; genuinely dead peers are the keepalive's job.
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
            proxy_buffering off;
        }

        # ── Control plane: SPA + /api (CDP tunnels split out above) ──
        location / {
            # POST /clipboard declares its limit in CHARACTERS (Pydantic
            # max_length=1_048_576) while nginx counts BYTES. A JSON encoding of
            # that many characters can reach ~12 bytes each — an escaped
            # supplementary character is \uXXXX\uXXXX — so honouring the API's
            # own stated boundary needs ~12.6 MB plus framing. Anything smaller
            # rejects bodies FastAPI would accept, and nginx's default (1m)
            # rejected even plain ASCII at the limit.
            client_max_body_size 16M;

            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }
    }
}
